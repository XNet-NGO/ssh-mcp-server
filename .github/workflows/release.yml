name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: linux-x64
            output: ssh-mcp-server-linux-x64
          # Linux ARM64
          - os: ubuntu-latest
            target: linux-arm64
            output: ssh-mcp-server-linux-arm64
          # Windows x64
          - os: windows-latest
            target: win-x64
            output: ssh-mcp-server-win-x64.exe
          # macOS x64
          - os: macos-latest
            target: macos-x64
            output: ssh-mcp-server-macos-x64
          # macOS ARM64
          - os: macos-latest
            target: macos-arm64
            output: ssh-mcp-server-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pkg
        run: npm install -g pkg

      - name: Build binary
        run: pkg . --targets node18-${{ matrix.target }} --output ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  create-packages:
    name: Create DEB and RPM packages
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: ssh-mcp-server-linux-x64
          path: ./binaries

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: ssh-mcp-server-linux-arm64
          path: ./binaries

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Create DEB package (x64)
        run: |
          mkdir -p ssh-mcp-server-x64/DEBIAN
          mkdir -p ssh-mcp-server-x64/usr/local/bin
          mkdir -p ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server
          
          cp binaries/ssh-mcp-server-linux-x64 ssh-mcp-server-x64/usr/local/bin/ssh-mcp-server
          chmod +x ssh-mcp-server-x64/usr/local/bin/ssh-mcp-server
          
          cp README.md ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server/
          cp LICENSE ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server/
          
          cat > ssh-mcp-server-x64/DEBIAN/control << EOF
          Package: ssh-mcp-server
          Version: 0.2.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Joshua S. Doucette <joshua@xnet.ngo>
          Description: Model Context Protocol server for SSH operations
           SSH MCP Server exposes comprehensive SSH functionality to AI assistants
           through the Model Context Protocol (MCP). Developed by XNet Inc.
          Homepage: https://github.com/XNet-NGO/ssh-mcp-server
          EOF
          
          dpkg-deb --build ssh-mcp-server-x64
          mv ssh-mcp-server-x64.deb ssh-mcp-server_0.2.0_amd64.deb

      - name: Create DEB package (ARM64)
        run: |
          mkdir -p ssh-mcp-server-arm64/DEBIAN
          mkdir -p ssh-mcp-server-arm64/usr/local/bin
          mkdir -p ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server
          
          cp binaries/ssh-mcp-server-linux-arm64 ssh-mcp-server-arm64/usr/local/bin/ssh-mcp-server
          chmod +x ssh-mcp-server-arm64/usr/local/bin/ssh-mcp-server
          
          cp README.md ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server/
          cp LICENSE ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server/
          
          cat > ssh-mcp-server-arm64/DEBIAN/control << EOF
          Package: ssh-mcp-server
          Version: 0.2.0
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: Joshua S. Doucette <joshua@xnet.ngo>
          Description: Model Context Protocol server for SSH operations
           SSH MCP Server exposes comprehensive SSH functionality to AI assistants
           through the Model Context Protocol (MCP). Developed by XNet Inc.
          Homepage: https://github.com/XNet-NGO/ssh-mcp-server
          EOF
          
          dpkg-deb --build ssh-mcp-server-arm64
          mv ssh-mcp-server-arm64.deb ssh-mcp-server_0.2.0_arm64.deb

      - name: Create RPM spec file
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          cat > ~/rpmbuild/SPECS/ssh-mcp-server.spec << 'EOF'
          Name:           ssh-mcp-server
          Version:        0.2.0
          Release:        1%{?dist}
          Summary:        Model Context Protocol server for SSH operations
          License:        MIT
          URL:            https://github.com/XNet-NGO/ssh-mcp-server
          Source0:        ssh-mcp-server-linux-x64
          Source1:        ssh-mcp-server-linux-arm64

          %description
          SSH MCP Server exposes comprehensive SSH functionality to AI assistants
          through the Model Context Protocol (MCP). Developed by XNet Inc.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/usr/local/bin
          %ifarch x86_64
          install -m 755 %{SOURCE0} %{buildroot}/usr/local/bin/ssh-mcp-server
          %endif
          %ifarch aarch64
          install -m 755 %{SOURCE1} %{buildroot}/usr/local/bin/ssh-mcp-server
          %endif

          %files
          /usr/local/bin/ssh-mcp-server

          %changelog
          * Tue Jan 21 2026 Joshua S. Doucette <joshua@xnet.ngo> - 0.2.0-1
          - Initial RPM release
          - Stateless architecture for Docker MCP Gateway
          EOF

      - name: Build RPM packages
        run: |
          cp binaries/ssh-mcp-server-linux-x64 ~/rpmbuild/SOURCES/
          cp binaries/ssh-mcp-server-linux-arm64 ~/rpmbuild/SOURCES/
          
          rpmbuild --target x86_64 -bb ~/rpmbuild/SPECS/ssh-mcp-server.spec
          rpmbuild --target aarch64 -bb ~/rpmbuild/SPECS/ssh-mcp-server.spec
          
          cp ~/rpmbuild/RPMS/x86_64/ssh-mcp-server-0.2.0-1.*.x86_64.rpm ./ssh-mcp-server-0.2.0-1.x86_64.rpm
          cp ~/rpmbuild/RPMS/aarch64/ssh-mcp-server-0.2.0-1.*.aarch64.rpm ./ssh-mcp-server-0.2.0-1.aarch64.rpm

      - name: Upload DEB x64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server_0.2.0_amd64.deb
          path: ssh-mcp-server_0.2.0_amd64.deb

      - name: Upload DEB ARM64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server_0.2.0_arm64.deb
          path: ssh-mcp-server_0.2.0_arm64.deb

      - name: Upload RPM x64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server-0.2.0-1.x86_64.rpm
          path: ssh-mcp-server-0.2.0-1.x86_64.rpm

      - name: Upload RPM ARM64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server-0.2.0-1.aarch64.rpm
          path: ssh-mcp-server-0.2.0-1.aarch64.rpm

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, create-packages]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: SSH MCP Server v0.2.0 - Stateless Architecture
          body_path: VERSION_0.2.0_RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/ssh-mcp-server-linux-x64/ssh-mcp-server-linux-x64
            artifacts/ssh-mcp-server-linux-arm64/ssh-mcp-server-linux-arm64
            artifacts/ssh-mcp-server-win-x64.exe/ssh-mcp-server-win-x64.exe
            artifacts/ssh-mcp-server-macos-x64/ssh-mcp-server-macos-x64
            artifacts/ssh-mcp-server-macos-arm64/ssh-mcp-server-macos-arm64
            artifacts/ssh-mcp-server_0.2.0_amd64.deb/ssh-mcp-server_0.2.0_amd64.deb
            artifacts/ssh-mcp-server_0.2.0_arm64.deb/ssh-mcp-server_0.2.0_arm64.deb
            artifacts/ssh-mcp-server-0.2.0-1.x86_64.rpm/ssh-mcp-server-0.2.0-1.x86_64.rpm
            artifacts/ssh-mcp-server-0.2.0-1.aarch64.rpm/ssh-mcp-server-0.2.0-1.aarch64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
