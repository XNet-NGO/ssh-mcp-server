name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            target: linux-x64
            output: ssh-mcp-server-linux-x64
          # Linux ARM64
          - os: ubuntu-latest
            target: linux-arm64
            output: ssh-mcp-server-linux-arm64
          # Windows x64
          - os: windows-latest
            target: win-x64
            output: ssh-mcp-server-win-x64.exe
          # macOS x64
          - os: macos-latest
            target: macos-x64
            output: ssh-mcp-server-macos-x64
          # macOS ARM64
          - os: macos-latest
            target: macos-arm64
            output: ssh-mcp-server-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install pkg
        run: npm install -g pkg

      - name: Build binary
        run: pkg . --targets node18-${{ matrix.target }} --output ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  create-packages:
    name: Create DEB packages
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v4
        with:
          name: ssh-mcp-server-linux-x64
          path: ./binaries

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: ssh-mcp-server-linux-arm64
          path: ./binaries

      - name: Create DEB package (x64)
        run: |
          mkdir -p ssh-mcp-server-x64/DEBIAN
          mkdir -p ssh-mcp-server-x64/usr/local/bin
          mkdir -p ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server
          
          cp binaries/ssh-mcp-server-linux-x64 ssh-mcp-server-x64/usr/local/bin/ssh-mcp-server
          chmod +x ssh-mcp-server-x64/usr/local/bin/ssh-mcp-server
          
          cp README.md ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server/
          cp LICENSE ssh-mcp-server-x64/usr/share/doc/ssh-mcp-server/
          
          cat > ssh-mcp-server-x64/DEBIAN/control << EOF
          Package: ssh-mcp-server
          Version: 0.2.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Joshua S. Doucette <joshua@xnet.ngo>
          Description: Model Context Protocol server for SSH operations
           SSH MCP Server exposes comprehensive SSH functionality to AI assistants
           through the Model Context Protocol (MCP). Developed by XNet Inc.
          Homepage: https://github.com/XNet-NGO/ssh-mcp-server
          EOF
          
          dpkg-deb --build ssh-mcp-server-x64
          mv ssh-mcp-server-x64.deb ssh-mcp-server_0.2.0_amd64.deb

      - name: Create DEB package (ARM64)
        run: |
          mkdir -p ssh-mcp-server-arm64/DEBIAN
          mkdir -p ssh-mcp-server-arm64/usr/local/bin
          mkdir -p ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server
          
          cp binaries/ssh-mcp-server-linux-arm64 ssh-mcp-server-arm64/usr/local/bin/ssh-mcp-server
          chmod +x ssh-mcp-server-arm64/usr/local/bin/ssh-mcp-server
          
          cp README.md ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server/
          cp LICENSE ssh-mcp-server-arm64/usr/share/doc/ssh-mcp-server/
          
          cat > ssh-mcp-server-arm64/DEBIAN/control << EOF
          Package: ssh-mcp-server
          Version: 0.2.0
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: Joshua S. Doucette <joshua@xnet.ngo>
          Description: Model Context Protocol server for SSH operations
           SSH MCP Server exposes comprehensive SSH functionality to AI assistants
           through the Model Context Protocol (MCP). Developed by XNet Inc.
          Homepage: https://github.com/XNet-NGO/ssh-mcp-server
          EOF
          
          dpkg-deb --build ssh-mcp-server-arm64
          mv ssh-mcp-server-arm64.deb ssh-mcp-server_0.2.0_arm64.deb

      - name: Upload DEB x64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server_0.2.0_amd64.deb
          path: ssh-mcp-server_0.2.0_amd64.deb

      - name: Upload DEB ARM64
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server_0.2.0_arm64.deb
          path: ssh-mcp-server_0.2.0_arm64.deb

  create-archives:
    name: Create TAR and ZIP archives
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create archive directories
        run: |
          mkdir -p archives/ssh-mcp-server-0.2.0-linux-x64
          mkdir -p archives/ssh-mcp-server-0.2.0-linux-arm64
          mkdir -p archives/ssh-mcp-server-0.2.0-windows-x64
          mkdir -p archives/ssh-mcp-server-0.2.0-macos-x64
          mkdir -p archives/ssh-mcp-server-0.2.0-macos-arm64

      - name: Prepare Linux x64 archive
        run: |
          cp artifacts/ssh-mcp-server-linux-x64/ssh-mcp-server-linux-x64 archives/ssh-mcp-server-0.2.0-linux-x64/ssh-mcp-server
          chmod +x archives/ssh-mcp-server-0.2.0-linux-x64/ssh-mcp-server
          cp README.md LICENSE INSTALLATION.md archives/ssh-mcp-server-0.2.0-linux-x64/
          
      - name: Prepare Linux ARM64 archive
        run: |
          cp artifacts/ssh-mcp-server-linux-arm64/ssh-mcp-server-linux-arm64 archives/ssh-mcp-server-0.2.0-linux-arm64/ssh-mcp-server
          chmod +x archives/ssh-mcp-server-0.2.0-linux-arm64/ssh-mcp-server
          cp README.md LICENSE INSTALLATION.md archives/ssh-mcp-server-0.2.0-linux-arm64/

      - name: Prepare Windows x64 archive
        run: |
          cp artifacts/ssh-mcp-server-win-x64.exe/ssh-mcp-server-win-x64.exe archives/ssh-mcp-server-0.2.0-windows-x64/ssh-mcp-server.exe
          cp README.md LICENSE INSTALLATION.md archives/ssh-mcp-server-0.2.0-windows-x64/

      - name: Prepare macOS x64 archive
        run: |
          cp artifacts/ssh-mcp-server-macos-x64/ssh-mcp-server-macos-x64 archives/ssh-mcp-server-0.2.0-macos-x64/ssh-mcp-server
          chmod +x archives/ssh-mcp-server-0.2.0-macos-x64/ssh-mcp-server
          cp README.md LICENSE INSTALLATION.md archives/ssh-mcp-server-0.2.0-macos-x64/

      - name: Prepare macOS ARM64 archive
        run: |
          cp artifacts/ssh-mcp-server-macos-arm64/ssh-mcp-server-macos-arm64 archives/ssh-mcp-server-0.2.0-macos-arm64/ssh-mcp-server
          chmod +x archives/ssh-mcp-server-0.2.0-macos-arm64/ssh-mcp-server
          cp README.md LICENSE INSTALLATION.md archives/ssh-mcp-server-0.2.0-macos-arm64/

      - name: Create TAR.GZ archives
        run: |
          cd archives
          tar -czf ssh-mcp-server-0.2.0-linux-x64.tar.gz ssh-mcp-server-0.2.0-linux-x64/
          tar -czf ssh-mcp-server-0.2.0-linux-arm64.tar.gz ssh-mcp-server-0.2.0-linux-arm64/
          tar -czf ssh-mcp-server-0.2.0-macos-x64.tar.gz ssh-mcp-server-0.2.0-macos-x64/
          tar -czf ssh-mcp-server-0.2.0-macos-arm64.tar.gz ssh-mcp-server-0.2.0-macos-arm64/

      - name: Create ZIP archives
        run: |
          cd archives
          zip -r ssh-mcp-server-0.2.0-linux-x64.zip ssh-mcp-server-0.2.0-linux-x64/
          zip -r ssh-mcp-server-0.2.0-linux-arm64.zip ssh-mcp-server-0.2.0-linux-arm64/
          zip -r ssh-mcp-server-0.2.0-windows-x64.zip ssh-mcp-server-0.2.0-windows-x64/
          zip -r ssh-mcp-server-0.2.0-macos-x64.zip ssh-mcp-server-0.2.0-macos-x64/
          zip -r ssh-mcp-server-0.2.0-macos-arm64.zip ssh-mcp-server-0.2.0-macos-arm64/

      - name: Upload TAR.GZ archives
        uses: actions/upload-artifact@v4
        with:
          name: tar-archives
          path: |
            archives/*.tar.gz

      - name: Upload ZIP archives
        uses: actions/upload-artifact@v4
        with:
          name: zip-archives
          path: |
            archives/*.zip

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for attestations
      attestations: write  # Required for attestations
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: xnetadmin
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for SSH MCP Server
        id: meta-ssh
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            xnetadmin/openssh-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push SSH MCP Server image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ssh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ssh.outputs.tags }}
          labels: ${{ steps.meta-ssh.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true  # Enable provenance attestation
          sbom: true  # Enable SBOM attestation

      - name: Generate artifact attestation for GHCR
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub repository description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: xnetadmin
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: xnetadmin/openssh-mcp
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
